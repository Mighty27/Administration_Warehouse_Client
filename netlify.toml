# netlify.toml — Konfigurasi Deployment Static SPA (Vite + React)
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Aturan Redirect SPA wajib agar React Router tidak mengalami error 404 saat halaman di-refresh
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security Headers & Optimasi Cache Aset Statis di Netlify
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
