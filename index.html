<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LogiVault — Sistem Operasional Admin Warehouse</title>
    <meta name="description" content="Aplikasi operasional Admin Warehouse enterprise berbasis React (Vite), Tailwind CSS, dan Supabase dengan isolasi data RLS per akun, manajemen inventaris SKU, transaksi inbound/outbound, dan Cloud File Vault." />
    <meta property="og:title" content="LogiVault — Sistem Operasional Admin Warehouse" />
    <meta property="og:description" content="Aplikasi operasional Admin Warehouse enterprise berbasis React (Vite), Tailwind CSS, dan Supabase dengan isolasi data RLS per akun." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('logivault_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'dark' || (!saved && prefersDark)) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-slate-100 antialiased transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
